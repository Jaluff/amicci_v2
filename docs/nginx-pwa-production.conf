# =============================================================================
# Nginx — PWA Repartidores (puerto 3000 con SSL)
# =============================================================================
#
# Este archivo va en Laragon:
#   C:\laragon\etc\nginx\sites-enabled\amicci-pwa.conf
#
# Apunta al mismo directorio public/ del proyecto Laravel.
# Solo permite acceso a /api/* y /pwa/* (todo lo demás devuelve 403).
#
# IMPORTANTE: Ajustá las rutas según tu instalación de Laragon.
# =============================================================================

server {
    listen 3000 ssl;
    server_name _;  # Acepta cualquier host (IP pública)

    # ── SSL (certificado autofirmado) ─────────────────────────
    # Generá un certificado autofirmado con:
    #   openssl req -x509 -nodes -days 3650 -newkey rsa:2048 \
    #     -keyout C:/laragon/etc/ssl/amicci-pwa.key \
    #     -out C:/laragon/etc/ssl/amicci-pwa.crt \
    #     -subj "/CN=TU_IP_PUBLICA"
    #
    ssl_certificate     C:/laragon/etc/ssl/amicci-pwa.crt;
    ssl_certificate_key C:/laragon/etc/ssl/amicci-pwa.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # ── Raíz del proyecto Laravel ─────────────────────────────
    root "C:/laragon/www/amicci2-sys/public";  # AJUSTAR RUTA
    index index.php;
    charset utf-8;

    # Logs separados para debug
    access_log  C:/laragon/logs/amicci-pwa-access.log;
    error_log   C:/laragon/logs/amicci-pwa-error.log;

    # ── 1. PWA Assets estáticos ───────────────────────────────
    # Servir manifest, service worker, íconos
    location = /manifest.json {
        try_files $uri =404;
    }

    location = /sw.js {
        try_files $uri =404;
        # Service Workers no deben cachearse
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location /pwa-icons/ {
        try_files $uri =404;
    }

    location /images/ {
        try_files $uri =404;
    }

    # Assets compilados por Vite (JS/CSS con hashes)
    location /build/ {
        try_files $uri =404;
        # Assets con hash — cachear agresivamente
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ── 2. PWA Shell (SPA — todas las rutas /pwa/* van a Laravel) ──
    location /pwa {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ── 3. API Routes ─────────────────────────────────────────
    location /api {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ── 4. PHP-FPM (solo para /pwa y /api) ────────────────────
    location ~ \.php$ {
        # Laragon en Windows usa TCP por defecto
        fastcgi_pass 127.0.0.1:9000;  # Verificar puerto de PHP-FPM en Laragon
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;

        # Headers CORS para la PWA (si accede desde otro dominio/puerto)
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept" always;

        # Forzar HTTPS en las respuestas de Laravel
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
    }

    # ── 5. Bloquear todo lo demás ─────────────────────────────
    # No se puede acceder al panel admin, login web, etc.
    location / {
        return 403;
    }

    # ── 6. Preflight CORS (OPTIONS) ───────────────────────────
    location @cors_preflight {
        add_header Access-Control-Allow-Origin "*";
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept";
        add_header Content-Length 0;
        add_header Content-Type text/plain;
        return 204;
    }

    # Manejar OPTIONS para CORS
    if ($request_method = 'OPTIONS') {
        return 204;
    }
}
